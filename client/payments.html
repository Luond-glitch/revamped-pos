<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d">
    <title>Payments · Universal POS</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/payments.css"></head><body><nav id="nav"></nav><main>
    <div class="iv rp-report">
      <header class="iv-head"><div><h1>Payments &amp; finance</h1><p>Payments, reconciliation, expenses, cash movements, supplier balances and VAT</p></div>
        <div class="iv-actions rp-noprint"><button type="button" id="csv">Download CSV</button><button type="button" id="journal">Accounting export</button><button type="button" id="print" class="btn gold">Print / Save PDF</button></div></header>
      <section class="card rp-filters rp-noprint" aria-label="Filters">
        <div class="rp-presets" id="presets"><button type="button" data-p="today">Today</button><button type="button" data-p="7">Last 7 days</button><button type="button" data-p="30">Last 30 days</button><button type="button" data-p="month">This month</button><button type="button" data-p="year">This year</button></div>
        <label>From<input type="date" id="from"></label>
        <label>To<input type="date" id="to"></label>
        <label>Payment method<select id="method"></select></label>
      </section>
      <div class="iv-stats rp-kpis" id="stats" style="--cols:3"></div>
      <div class="rp-tabs rp-noprint" id="tabs" role="tablist" aria-label="Finance sections"></div>
      <div id="view"></div>
    </div>
    </main><script src="js/api.js"></script><script src="js/finance-api.js"></script><script src="js/app.js"></script><script src="js/analytics.js"></script><script src="js/payments.js"></script></body></html>
