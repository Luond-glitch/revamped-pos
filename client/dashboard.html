<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d">
    <title>Dashboard · Universal POS</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/reports.css"></head><body><nav id="nav"></nav><main>
    <div class="iv">
      <header class="iv-head"><div><h1>Dashboard</h1><p id="today"></p></div><div class="iv-actions" id="go"></div></header>
      <div id="shift"></div>
      <div class="iv-stats rp-kpis" id="stats"></div>
      <div class="iv-grid rp-dense">
        <section class="card iv-panel span2"><h2>Sales trend <span class="rp-seg" id="seg" role="group" aria-label="Chart period"></span></h2><div id="trend"></div></section>
        <section class="card iv-panel"><h2>Payment methods <small>this month</small></h2><div id="pay"></div></section>
        <section class="card iv-panel"><h2>Stock levels <small>lowest first</small></h2><div id="levels"></div></section>
        <section class="card iv-panel"><h2>Top products <small>this month</small></h2><div id="top"></div></section>
        <section class="card iv-panel" id="profitbox"><h2>Profit summary <small>this month</small></h2><div id="profit"></div></section>
        <section class="card iv-panel span2"><h2>Recent sales</h2>
          <table><thead><tr><th>Receipt</th><th>Time</th><th>Cashier</th><th class="n">Total</th><th></th></tr></thead><tbody id="sales"></tbody></table></section>
        <section class="card iv-panel"><h2>Low-stock alerts <span id="alertN"></span></h2><div id="alerts"></div></section>
      </div>
    </div>
    </main><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/analytics.js"></script><script src="js/dashboard.js"></script></body></html>
