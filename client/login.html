<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>Staff sign in · Universal POS</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css">
<style>body{display:flex;align-items:center;justify-content:center;background:linear-gradient(155deg,#14213d,#1d3f66 55%,#0f7b5f)}form{width:min(380px,92vw);margin:16px}form a{color:var(--accent)}</style></head><body>
<form class="card" id="f"><h1>Staff sign in</h1><p class="sub">Managers and cashiers</p>
<label>Email<input type="email" id="email" required autofocus></label><label>Password<input type="password" id="pw" required></label>
<p id="err" style="color:var(--danger);min-height:1.2em;margin:0 0 8px" role="alert"></p><button class="primary" style="width:100%">Sign in</button>
<p class="sub" style="margin:12px 0 0;font-size:.82rem">Demo: manager@shop.co.ke / manager123 · cashier@shop.co.ke / cashier123</p>
<p class="sub" style="margin:8px 0 0;font-size:.9rem">Not staff? <a href="shop.html">Client sign in</a></p></form>
<script src="js/api.js"></script><script src="js/app.js"></script><script src="js/login.js"></script></body></html>
