<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d">
    <title>Purchases · Universal POS</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css"></head><body><nav id="nav"></nav><main>
    <div class="fn pu rp-report">
      <div class="fn-frame">
        <aside class="fn-side">
          <div class="fn-logo" aria-label="Universal POS">Universal<b>POS</b></div>
          <div id="tabs" role="tablist" aria-label="Purchasing sections"></div>
        </aside>
        <div class="fn-main">
          <header class="fn-top">
            <h1 id="ptitle">Dashboard</h1>
            <div class="fn-tools rp-noprint">
              <select id="range" aria-label="Period"><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="year">This year</option><option value="all" selected>All time</option><option value="custom">Custom dates…</option></select>
              <span class="fn-dates" id="dates" hidden><input type="date" id="from" aria-label="From"><input type="date" id="to" aria-label="To"></span>
              <select id="supplier" aria-label="Supplier"></select>
              <button type="button" id="csv">Export CSV</button>
              <button type="button" id="print" aria-label="Print or save as PDF">Print</button>
              <button type="button" id="addpo" class="gold">New purchase order</button>
            </div>
          </header>
          <p class="rp-printmeta" id="pmeta"></p>
          <div class="iv-stats rp-kpis" id="stats" style="--cols:4"></div>
          <div id="view"></div>
          <p class="fn-note rp-noprint">Stock only changes when goods received are authorised. Supplier payments are tracked here, not paid from here.</p>
        </div>
      </div>
    </div>
    </main><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/analytics.js"></script><script src="js/purchases.js"></script></body></html>
