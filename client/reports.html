<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d">
<title>Reports · Universal POS</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css"></head><body><nav id="nav"></nav><main>
<h1>Reports</h1><div class="row" style="margin:8px 0 16px"><label style="margin:0">From<input type="date" id="from"></label><label style="margin:0">To<input type="date" id="to"></label></div>

</main><script src="js/api.js"></script><script src="js/app.js"></script><script src="js/reports.js"></script></body></html>
